name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Запросы SQLx проверяются по server/.sqlx; база нужна только тестам.
  SQLX_OFFLINE: "true"
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/avtodom

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avtodom
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint src
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [server, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avtodom
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Сборка
        run: |
          (cd web && npm ci && npm run build && npx playwright install --with-deps chromium)
          (cd server && cargo build --locked)
      - name: Запуск сервера
        working-directory: server
        env:
          BOOTSTRAP_OWNER_LOGIN: owner
          BOOTSTRAP_OWNER_PASSWORD: owner-pass-1
          WEB_DIR: ../web/dist
        run: |
          nohup ./target/debug/avtodom-server > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/ > /dev/null && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Сквозные тесты
        working-directory: web
        env:
          CI: "true"
          E2E_LOGIN: owner
          E2E_PASSWORD: owner-pass-1
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results
            server/server.log
          retention-days: 7
