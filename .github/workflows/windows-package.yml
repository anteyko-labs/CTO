name: Windows package

# Пакет для компьютера точки: сервер .exe, клиент, Caddy и скрипты установки (ADR-057).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', 'web/**', 'deploy/windows/**', '.github/workflows/windows-package.yml']

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  CADDY_VERSION: "2.8.4"

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Сервер
        working-directory: server
        run: cargo build --release --locked
      - name: Клиент
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Сборка пакета
        shell: pwsh
        run: |
          $out = "avtodom-windows"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item server/target/release/avtodom-server.exe $out/
          Copy-Item -Recurse web/dist "$out/web"
          Copy-Item deploy/windows/* $out/
          $zip = "caddy.zip"
          Invoke-WebRequest -Uri "https://github.com/caddyserver/caddy/releases/download/v$env:CADDY_VERSION/caddy_$($env:CADDY_VERSION)_windows_amd64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath caddy-tmp
          Copy-Item caddy-tmp/caddy.exe $out/
      - uses: actions/upload-artifact@v4
        with:
          name: avtodom-windows
          path: avtodom-windows
          retention-days: 30
